name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Winche.Rules.slnx

      - name: Build
        run: dotnet build Winche.Rules.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack src/Winche.Rules/Winche.Rules.csproj -c Release --no-build -o ./packages

      - name: Push
        run: dotnet nuget push ./packages/*.nupkg ./packages/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
